<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spiccio · Dashboard</title>
<meta name="theme-color" content="#F4EEE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Spiccio — Dashboard avorio */
:root {
  --bg: #F4EEE3; --side: #EEE6D6; --card: #FFFDF8; --soft: #F5EFE3; --soft2: #EAE1CF; --line: #E9E0CF; --line2: #D6CAB2;
  --ink: #1D1A14; --ink2: #4A453B; --mut: #6B6458; --dim: #9C9381;
  --acc: #3155F5; --acc2: #1E36B8; --acc-soft: #E5EAFF; --acc-mid: #AFBEFB;
  --ok: #138A4E; --ok-soft: rgba(19,138,78,.1); --warn: #B26A00; --warn-soft: #FCEEDA; --bad: #C93636; --bad-soft: rgba(201,54,54,.1);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #e0960b; --s5: #e0729b; --s6: #0b8a0b; --s7: #6250d6; --s8: #9C9381;
  --sh: 0 1px 0 rgba(255,255,255,.9) inset, 0 18px 40px -22px rgba(74,56,24,.28), 0 2px 6px -2px rgba(74,56,24,.08);
  --sh2: 0 1px 0 rgba(255,255,255,.9) inset, 0 34px 60px -28px rgba(74,56,24,.38), 0 4px 12px -4px rgba(74,56,24,.1);
  --r: 22px;
  --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --disp: "Space Grotesk", Inter, system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--acc); text-decoration: none; }
svg { display: block; }
.disp { font-family: var(--disp); }
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--ok); } .neg { color: var(--bad); } .wrn { color: var(--warn); } .mut { color: var(--mut); }

/* ------------------------------ LAYOUT ------------------------------ */
.dash { display: flex; min-height: 100vh; }
.side { width: 244px; flex: none; position: sticky; top: 0; height: 100vh; background: var(--side); border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; gap: 3px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 22px; }
.brand .logo { width: 36px; height: 36px; border-radius: 11px; background: var(--acc); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 18px -8px rgba(49,85,245,.7); }
.brand b { display: block; font-family: var(--disp); font-size: 19px; }
.brand small { color: var(--mut); font-size: 11.5px; }
.nav { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 11px; color: var(--mut); font-weight: 600; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; transition: background .2s, color .2s; }
.nav:hover { background: var(--soft); color: var(--ink); }
.nav[aria-current="page"] { background: var(--card); color: var(--ink); box-shadow: var(--sh); }
.nav .bdg { margin-left: auto; background: var(--acc); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
.nav kbd { margin-left: auto; font: 600 10.5px var(--font); color: var(--dim); border: 1px solid var(--line2); border-radius: 5px; padding: 0 5px; }
.nav .bdg + kbd { margin-left: 6px; }
.side .grow { flex: 1; min-height: 24px; }
.syncbox { border-top: 1px solid var(--line); padding: 14px 8px 0; display: flex; flex-direction: column; gap: 10px; font-size: 12px; color: var(--mut); }
.syncbox .st { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
.dot.ok { background: var(--ok); animation: pulse 2.4s ease-in-out infinite; } .dot.bad { background: var(--bad); } .dot.busy { background: var(--warn); }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(19,138,78,.15); } }
.iconrow { display: flex; gap: 6px; }

.main { flex: 1; min-width: 0; padding: 28px 34px 64px; }
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
.top h1 { font-family: var(--disp); font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
.top .tt { flex: 1 1 300px; min-width: 0; }
.top p { margin: 4px 0 0; color: var(--mut); }
.tabs { display: none; }

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; align-items: start; }
.s2 { grid-column: span 2; } .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; }
.s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
.stretch { align-self: stretch; }
@media (max-width: 1320px) { .s3 { grid-column: span 6; } .s4, .s5 { grid-column: span 6; } .s7, .s8 { grid-column: span 12; } .s6.full-md { grid-column: span 12; } }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 24px; min-width: 0; box-shadow: var(--sh); transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s; }
.card.tilt:hover { transform: perspective(1200px) rotateX(2.5deg) rotateY(-3deg) translateY(-3px); box-shadow: var(--sh2); }
.card h2 { margin: 0 0 4px; font-family: var(--disp); font-size: 17px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.card h2 .r { font: 500 13px var(--font); color: var(--mut); }
.card .lead { margin: 0 0 16px; color: var(--mut); font-size: 13.5px; }
.card.pad-s { padding: 16px 18px; }
.empty { color: var(--mut); padding: 22px 0; text-align: center; }
.note { color: var(--mut); font-size: 12.5px; line-height: 1.5; margin: 12px 0 0; }

.rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) backwards; }
.grid > .rise:nth-child(2) { animation-delay: .05s; } .grid > .rise:nth-child(3) { animation-delay: .1s; } .grid > .rise:nth-child(4) { animation-delay: .15s; }
.grid > .rise:nth-child(5) { animation-delay: .2s; } .grid > .rise:nth-child(6) { animation-delay: .25s; } .grid > .rise:nth-child(7) { animation-delay: .3s; }
.grid > .rise:nth-child(8) { animation-delay: .35s; } .grid > .rise:nth-child(n+9) { animation-delay: .4s; }
@keyframes rise { from { opacity: 0; transform: perspective(1200px) rotateX(20deg) translateY(36px) scale(.97); } }
.grow { transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) .35s both; }
@keyframes grow { from { transform: scaleX(0); } }
.growy { animation: growy 1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes growy { from { transform: scaleY(0); } }
.draw { stroke-dasharray: 1; animation: draw 1.6s cubic-bezier(.4,0,.2,1) .4s both; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.fade { animation: fade .9s ease .9s both; } @keyframes fade { from { opacity: 0; } }
.noanim .rise, .noanim .grow, .noanim .growy, .noanim .draw, .noanim .fade { animation: none !important; }
@media (prefers-reduced-motion: reduce) { .rise, .grow, .growy, .draw, .fade, .dot.ok { animation: none !important; } .card.tilt:hover { transform: none; } }

/* KPI */
.kpi .k { color: var(--mut); font-weight: 600; font-size: 13px; }
.kpi .v { font-family: var(--disp); font-size: 30px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
.kpi .s { color: var(--mut); font-size: 13px; }

.chips { display: flex; flex-direction: column; gap: 10px; }
.chip { background: var(--soft); border-radius: 14px; padding: 12px 16px; min-width: 120px; }
.chip .k { font-size: 12px; color: var(--mut); } .chip .v { font-family: var(--disp); font-size: 22px; font-weight: 700; margin-top: 2px; }

/* hero */
.hero { display: flex; flex-direction: column; gap: 16px; }
.hero .big { font-family: var(--disp); font-size: 78px; font-weight: 700; letter-spacing: -.045em; line-height: 1; margin-top: 8px; }
.hero .big.pos { color: var(--acc); } .hero .big.neg { color: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--mut); font-size: 12.5px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.legend i.ln { height: 3px; width: 16px; border-radius: 2px; }
.legend i.lgdash { height: 0; width: 16px; border-top: 2px dashed var(--dim); border-radius: 0; }
.legend i.lgdot { height: 0; width: 16px; border-top: 2px dotted var(--acc); border-radius: 0; }

/* barre orizzontali */
.pb { padding: 7px 0; }
.pb .h { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; }
.pb .h b { font-weight: 600; } .pb .h span { color: var(--mut); white-space: nowrap; }
.pb .t { height: 9px; background: var(--soft2); border-radius: 5px; margin-top: 6px; overflow: hidden; position: relative; }
.pb .t i { display: block; height: 100%; border-radius: 5px; background: var(--acc); }
.pb .t i.ok { background: var(--ok); } .pb .t i.warn { background: #E49B1F; } .pb .t i.bad { background: var(--bad); }
.pb .t b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .6; }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); } .badge.warn { background: var(--warn-soft); color: var(--warn); } .badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.n { background: var(--soft); color: var(--mut); } .badge.acc { background: var(--acc-soft); color: var(--acc2); }

/* liste */
.li { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.li + .li { border-top: 1px solid var(--line); }
.li .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--soft); color: var(--ink); }
.li .av.acc { background: var(--acc-soft); color: var(--acc); } .li .av.blue { background: #E2EEFC; color: var(--s1); } .li .av.warn { background: var(--warn-soft); color: var(--warn); } .li .av.ok { background: var(--ok-soft); color: var(--ok); }
.li .tx { flex: 1; min-width: 0; }
.li .t1 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .t2 { color: var(--mut); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .x { font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
.li.click { cursor: pointer; border-radius: 10px; }
.li.click:hover .t1 { color: var(--acc); }
.date { width: 44px; text-align: center; font-family: var(--disp); flex: none; }
.date b { display: block; font-size: 19px; line-height: 1.1; } .date small { font-size: 11px; color: var(--mut); text-transform: uppercase; }

.insight { display: flex; gap: 14px; align-items: flex-start; }
.insight .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.insight b { display: block; font-weight: 650; } .insight span { display: block; font-size: 13px; color: var(--mut); margin-top: 4px; line-height: 1.45; }

/* controlli */
.btn { border: 0; border-radius: 12px; padding: 10px 15px; font-weight: 650; cursor: pointer; background: var(--soft2); color: var(--ink); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; transition: transform .15s, filter .15s; }
.btn:hover { filter: brightness(.97); } .btn:active { transform: scale(.98); }
.btn.pri { background: var(--acc); color: #fff; box-shadow: 0 10px 20px -10px rgba(49,85,245,.8); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.soft { background: var(--acc-soft); color: var(--acc2); }
.btn.dng { background: var(--bad-soft); color: var(--bad); }
.btn.ghost { background: none; color: var(--mut); }
.btn.ico { padding: 8px; border-radius: 10px; }
.btn.sm { padding: 7px 11px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: default; }
.inp, select.inp { background: var(--card); border: 1px solid var(--line2); border-radius: 11px; padding: 9px 12px; outline: none; min-width: 0; }
.inp:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.search { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line2); border-radius: 11px; padding: 0 12px; color: var(--mut); }
.search:focus-within { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.search input { flex: 1; background: none; border: 0; outline: none; padding: 9px 0; min-width: 0; color: var(--ink); }
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: none; padding: 8px 14px; border-radius: 9px; cursor: pointer; font-weight: 600; color: var(--mut); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }

/* tabelle */
.tblwrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: auto; box-shadow: var(--sh); max-height: calc(100vh - 220px); }
table.t { width: 100%; border-collapse: collapse; }
table.t th { position: sticky; top: 0; z-index: 1; background: var(--card); text-align: left; font-size: 12px; font-weight: 650; color: var(--mut); padding: 13px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; }
table.t th.nos { cursor: default; }
table.t th .ar { color: var(--acc); }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:hover td { background: #FBF7EF; }
table.t tr.sel td { background: var(--acc-soft); }
table.t td.r, table.t th.r { text-align: right; white-space: nowrap; }
table.t td.imp { font-weight: 650; font-variant-numeric: tabular-nums; }
table.t td.dt { white-space: nowrap; color: var(--mut); font-variant-numeric: tabular-nums; }
table.t td.nt { max-width: 340px; }
table.t td.nt .a, table.t td.nt .raw, table.t td.nt .m { max-width: 300px; }
table.t td.nt .a { font-weight: 600; cursor: pointer; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.t td.nt .a:hover { color: var(--acc); }
table.t td.nt .m { color: var(--warn); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
table.t td.nt .raw { color: var(--mut); font-size: 11.5px; font-family: ui-monospace, Menlo, Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
table.t select.inl { background: transparent; border: 1px solid transparent; border-radius: 9px; padding: 5px 6px; max-width: 180px; cursor: pointer; }
table.t select.inl:hover, table.t select.inl:focus { border-color: var(--line2); background: var(--card); outline: none; }
table.t input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--acc); cursor: pointer; }
table.t tfoot td { position: sticky; bottom: 0; background: var(--card); font-weight: 700; border-top: 1px solid var(--line); border-bottom: 0; padding: 12px 10px; }
.bulk { position: sticky; top: 8px; z-index: 3; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--ink); color: var(--card); border-radius: 14px; padding: 9px 12px 9px 16px; margin-bottom: 12px; font-weight: 600; box-shadow: var(--sh2); }
.bulk select { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 9px; padding: 7px 9px; }
.bulk select option { color: #000; }
.bulk .btn { background: rgba(255,255,255,.14); color: #fff; }
.more { text-align: center; padding: 14px; }

/* grafici */
.chart { position: relative; width: 100%; }
.chart text { font-family: var(--font); }
.chart .hx .g { stroke: var(--ink); stroke-width: 1; opacity: 0; }
.chart .hx circle { opacity: 0; }
.chart .hx:hover .g, .chart .hx:hover circle { opacity: 1; }
.chart .bh:hover path, .chart .bh:hover rect.b { filter: brightness(1.12); }
#tip { position: fixed; z-index: 80; pointer-events: none; background: var(--ink); color: var(--card); border-radius: 12px; padding: 9px 12px; font-size: 12.5px; line-height: 1.5; box-shadow: 0 14px 30px -10px rgba(29,26,20,.5); max-width: 280px; }
#tip b { font-weight: 700; } #tip .m { opacity: .7; }

.minis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1320px) { .minis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mini { cursor: pointer; }
.mini .hd { display: flex; align-items: center; gap: 8px; }
.mini .hd b { flex: 1; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .sw { width: 11px; height: 11px; border-radius: 4px; flex: none; }
.mini.sel { outline: 2px solid var(--acc); outline-offset: 2px; }

.split { display: flex; gap: 3px; }
.split > div { height: 58px; display: flex; align-items: center; padding: 0 16px; color: #fff; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; min-width: 0; }
.split > div:first-child { border-radius: 14px 0 0 14px; } .split > div:last-child { border-radius: 0 14px 14px 0; }
.splitcols { display: flex; gap: 28px; margin-top: 22px; flex-wrap: wrap; }
.splitcols > div { flex: 1 1 220px; min-width: 0; }
.kvl { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; gap: 10px; }
.kvl span:first-child { color: var(--mut); } .kvl span:last-child { font-weight: 600; white-space: nowrap; }

.kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; }
.kv + .kv { border-top: 1px solid var(--line); }
.kv .k { color: var(--mut); min-width: 0; }
.kv .v { font-weight: 650; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.kv.tot .k { color: var(--ink); font-weight: 700; } .kv.tot .v { font-size: 16px; }

.hbar { display: grid; grid-template-columns: 52px 1fr 84px; gap: 12px; align-items: center; padding: 6px 0; }
.hbar .n { font-weight: 600; } .hbar .t { height: 22px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.hbar .t i { display: block; height: 100%; border-radius: 6px; background: var(--acc-mid); }
.hbar .t i.top { background: var(--acc); }
.hbar .x { text-align: right; font-family: var(--disp); font-weight: 700; font-size: 15px; }

.fc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.fc > div { background: var(--soft); border-radius: 16px; padding: 18px; }
.fc b { font-size: 15px; } .fc .v { font-family: var(--disp); font-size: 34px; font-weight: 700; margin-top: 4px; }
.fc p { font-size: 13.5px; color: var(--mut); margin: 6px 0 0; line-height: 1.5; }

/* estratti */
.drop { border: 1.5px dashed var(--line2); border-radius: 20px; padding: 18px 22px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; background: #FBF7EF; transition: border-color .2s, background .2s; }
.drop.over { border-color: var(--acc); background: var(--acc-soft); }
.drop .scene { width: 58px; height: 58px; position: relative; perspective: 600px; background: var(--soft); border-radius: 15px; overflow: hidden; flex: none; }
.sheet { position: absolute; left: 14px; top: 10px; width: 30px; height: 38px; border-radius: 5px; background: var(--card); border: 1px solid #E2D8C4; box-shadow: 0 8px 16px -8px rgba(74,56,24,.35); animation: sheet 3.6s cubic-bezier(.45,0,.55,1) infinite; }
.sheet::after { content: ""; position: absolute; left: 6px; right: 6px; top: 9px; height: 2px; background: #D9CFBB; box-shadow: 0 6px 0 #D9CFBB, 0 12px 0 var(--acc); }
.sheet:nth-child(2) { animation-delay: -1.2s; } .sheet:nth-child(3) { animation-delay: -2.4s; }
@keyframes sheet { 0% { transform: translate3d(0,14px,0) rotateX(40deg) rotateZ(-8deg); opacity: 0; } 25% { opacity: 1; } 60% { transform: translate3d(0,-8px,30px) rotateX(10deg) rotateZ(4deg); } 100% { transform: translate3d(0,-30px,0); opacity: 0; } }
.acct { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 13px; }
.acct b { display: block; font-size: 13px; } .acct span { font-size: 12px; color: var(--mut); }

/* form tabellari */
table.ed { width: 100%; border-collapse: collapse; }
table.ed th { text-align: left; font-size: 12px; color: var(--mut); font-weight: 650; padding: 6px 6px 8px; white-space: nowrap; }
table.ed td { padding: 4px 6px; border-top: 1px solid var(--line); }
table.ed .inp { width: 100%; padding: 7px 9px; }
table.ed .inp.n { text-align: right; max-width: 110px; }
table.ed input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--acc); }
.edwrap { overflow-x: auto; }

/* modale */

.modal.wide { width: min(860px, 100%); }
@keyframes pop { from { opacity: 0; transform: perspective(900px) rotateX(14deg) translateY(24px) scale(.97); } }
.modal h3 { margin: 0 0 16px; font-family: var(--disp); font-size: 21px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fgrid .w { grid-column: 1 / -1; }
.fld { display: flex; flex-direction: column; gap: 5px; }

.toasts { position: fixed; right: 22px; bottom: 22px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--ink); color: var(--card); border-radius: 14px; padding: 11px 15px; max-width: 360px; box-shadow: 0 14px 30px -10px rgba(29,26,20,.5); animation: pop .3s both; border-left: 4px solid var(--acc-mid); }
.toast b { display: block; } .toast.ok { border-left-color: #5CD195; } .toast.bad { border-left-color: #FF8A8A; } .toast.warn { border-left-color: #FFC266; }

.setup { max-width: 540px; margin: 9vh auto; padding: 0 16px; }
.setup h1 { font-family: var(--disp); font-size: 28px; margin: 0 0 8px; }
.setup ol { color: var(--mut); padding-left: 18px; line-height: 1.7; }

.report { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 32px 36px; max-width: 880px; box-shadow: var(--sh); }
.report h2 { font-family: var(--disp); font-size: 26px; margin: 0; }
.report .rsub { color: var(--mut); margin: 4px 0 22px; }
.report h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--mut); margin: 26px 0 8px; }
.report table { width: 100%; border-collapse: collapse; }
.report td, .report th { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.report th { font-size: 12px; color: var(--mut); font-weight: 650; }
.report td.r, .report th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.report .rkpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.report .rkpi div { background: var(--soft); border-radius: 14px; padding: 13px; }
.report .rkpi small { display: block; color: var(--mut); font-size: 11.5px; font-weight: 600; }
.report .rkpi b { font-family: var(--disp); font-size: 21px; }

/* ------------------------------ MOBILE ------------------------------ */
@media (max-width: 860px) {
  .side { display: none; }
  .main { padding: calc(16px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); }
  .top h1 { font-size: 28px; }
  .top .desk { display: none !important; }
  .grid { gap: 14px; }
  .s2, .s3 { grid-column: span 6; } .s4, .s5, .s6, .s7, .s8 { grid-column: span 12; }
  .card { padding: 18px; border-radius: 20px; }
  .card.tilt:hover { transform: none; }
  .hero .big { font-size: 56px; }
  .chips { flex-direction: row; width: 100%; } .chips .chip { flex: 1; min-width: 0; }
  .kpi .v { font-size: 24px; }
  .minis { grid-template-columns: 1fr 1fr; gap: 10px; }
  .mini .hd { flex-wrap: wrap; } .mini .hd b { flex: 1 1 calc(100% - 20px); } .mini .hd .badge { order: 3; }
  .fc { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .fc > div { padding: 12px 8px; text-align: center; } .fc .v { font-size: 19px; } .fc p { display: none; }
  .hide-m { display: none !important; }
  .tabs { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--side) 88%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line); padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); }
  .tabs button, .tabs a { flex: 1; border: 0; background: none; color: var(--dim); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; padding: 4px 0; min-height: 48px; justify-content: center; cursor: pointer; }
  .tabs [aria-current="page"] { color: var(--ink); }
  .toasts { left: 14px; right: 14px; bottom: calc(84px + env(safe-area-inset-bottom)); }
  .fgrid { grid-template-columns: 1fr; }
  .modal { padding: 18px; }
}
@media print {
  .side, .tabs, .top, .noprint, .toasts, #tip { display: none !important; }
  body, html { background: #fff; }
  .main { padding: 0; } .report { box-shadow: none; border: 0; padding: 0; max-width: none; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

<body>
<div id="app"><div class="setup"><p class="mut" style="text-align:center">Carico la dashboard…</p></div></div>
<div id="tip" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="icons.js"></script>
<script src="core.js"></script>
<script>
// =====================================================================
//  SPICCIO — Dashboard (PC + iPhone)
//  Stessi dati (Gist) e stesso motore di calcolo (core.js) dell'app.
// =====================================================================
(function () {
  "use strict";
  const { eur, eur0, dk, r2, somma, uid, parseAmount, inRange } = Core.util;
  const { MESI, GIORNI } = Core;
  const ic = Icons.icon;

  // ------------------------------ STATO ------------------------------
  const KEY = "spiccio.data.v1", LKEY = "spiccio.local.v1", EKEY = "spiccio.estratti.v1";
  let S = null, K = null, L = {}, E = { mov: [], conti: {} };
  const F = { mese: null, cat: "", metodo: "", q: "", sort: "ts", dir: -1, sel: new Set(), limite: 300,
    anaN: 6, anaCat: null, repMese: null, eTab: "mancante", eSel: new Set(), eCat: {} };
  const VIEWS = [
    ["oggi", "calendar", "Oggi"],
    ["spese", "list", "Spese"],
    ["estratti", "receipt", "Estratti conto"],
    ["analisi", "chart", "Analisi"],
    ["patrimonio", "piggy", "Patrimonio"],
    ["budget", "target", "Budget"],
    ["report", "print", "Report"],
  ];
  const MOBILE_VIEWS = ["oggi", "analisi"];
  const isMobile = () => matchMedia("(max-width: 860px)").matches;
  let view = VIEWS.some(v => v[0] === location.hash.slice(1)) ? location.hash.slice(1) : "oggi";
  let animate = true; // animazioni d'ingresso solo al cambio pagina, non a ogni ridisegno

  function loadAll() {
    try { S = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { S = null; }
    S = S ? Core.normalizza(S) : null;
    try { L = JSON.parse(localStorage.getItem(LKEY) || "{}"); } catch (e) { L = {}; }
    L = Object.assign({ gistId: "", token: "", nascondi: false, lastSync: null, syncErr: null }, L);
    try { E = Object.assign({ mov: [], conti: {} }, JSON.parse(localStorage.getItem(EKEY) || "{}")); } catch (e) { E = { mov: [], conti: {} }; }
    K = S ? Core.make(S) : null;
  }
  // rilegge L prima di salvare, per non cancellare campi scritti dall'app (push, promemoria…)
  function saveLocal() {
    try { const cur = JSON.parse(localStorage.getItem(LKEY) || "{}"); localStorage.setItem(LKEY, JSON.stringify({ ...cur, ...L })); } catch (e) {}
  }
  function saveData() {
    S.meta.updatedAt = new Date().toISOString();
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("Spazio pieno", "Non riesco a salvare in locale.", "bad"); }
  }
  function saveE() { try { localStorage.setItem(EKEY, JSON.stringify(E)); } catch (e) { toast("Spazio pieno", "Troppi movimenti salvati in questo browser.", "bad"); } }
  // Ogni modifica passa da qui: aggiorna, salva, ricalcola, sincronizza.
  function commit(fn, { config = false, after = render } = {}) {
    fn(S);
    if (config) S.settingsU = Date.now();
    saveData();
    K = Core.make(S);
    if (after) { animate = false; after(); }
    queueSync();
  }
  const touch = o => (o.u = Date.now(), o);
  function remove(list, id) { S[list] = S[list].filter(x => x.id !== id); S.deleted[id] = Date.now(); }

  // ----------------------------- HELPERS -----------------------------
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
  const M = v => L.nascondi ? "•••" : eur(v);
  const M0 = v => L.nascondi ? "•••" : eur0(v);
  const MS = v => L.nascondi ? "•••" : (v >= 0 ? "+" : "−") + eur0(Math.abs(v));
  const pct = (a, b) => Math.max(0, Math.min(100, b > 0 ? a / b * 100 : (a > 0 ? 100 : 0)));
  const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  const dShort = d => `${d.getDate()} ${MESI[d.getMonth()].slice(0, 3)}`;
  const dMed = d => `${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`;
  const p2 = n => String(n).padStart(2, "0");
  const dTab = d => `${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${String(d.getFullYear()).slice(2)} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  const dDay = d => `${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${String(d.getFullYear()).slice(2)}`;
  const toLocalInput = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 16); };
  const tip = html => `data-tip="${esc(html)}"`;
  const giorni = (a, b) => Math.round((new Date(a).setHours(0, 0, 0, 0) - new Date(b).setHours(0, 0, 0, 0)) / 864e5);
  function stato(speso, budget) { const p = budget > 0 ? speso / budget : (speso > 0 ? 2 : 0); return p > 1 ? "bad" : p >= 1 - (S.settings.budgetQuasiFinito || .2) ? "warn" : "ok"; }
  const anim = () => animate ? "rise" : "";
  const colCat = id => { const i = S.categories.findIndex(c => c.id === id); return i >= 0 && i < 7 ? `var(--s${i + 1})` : "var(--s8)"; };

  function toast(t1, t2 = "", kind = "") {
    const w = $("#toasts"); if (!w) return;
    const el = document.createElement("div");
    el.className = "toast " + kind; el.innerHTML = `<b>${esc(t1)}</b>${esc(t2)}`;
    w.append(el); setTimeout(() => el.remove(), 4200);
  }

  // ------------------------------- MESI ------------------------------
  // Il "mese" di Spiccio va dal giorno di paga al giorno prima della paga successiva.
  function mesi() {
    const out = [];
    const primo = S.spese.length ? new Date(Math.min(...S.spese.map(x => +new Date(x.ts)))) : new Date();
    let d = new Date();
    for (let i = 0; i < 120; i++) {
      const [s, e] = K.periodRange("mese", d);
      out.push({ key: dk(s), s, e });
      if (s <= primo) break;
      d = new Date(s); d.setDate(d.getDate() - 1);
    }
    return out;
  }
  const meseDi = key => mesi().find(c => c.key === key) || mesi()[0];
  const inCorso = c => c.e > new Date();
  const refDate = c => inCorso(c) ? new Date() : new Date(+c.e - 3600e3);
  const nomeMese = c => `${cap(MESI[c.s.getMonth()])} ${c.s.getFullYear()}`;
  const rangeMese = c => `${dShort(c.s)} – ${dShort(new Date(+c.e - 864e5))}`;
  function selMese(id, val, conTutto = false) {
    return `<select class="inp" id="${id}">${conTutto ? `<option value="tutto"${val === "tutto" ? " selected" : ""}>Tutti i mesi</option>` : ""}${mesi().map(c => `<option value="${c.key}"${c.key === val ? " selected" : ""}>${nomeMese(c)} · ${rangeMese(c)}${inCorso(c) ? " (in corso)" : ""}</option>`).join("")}</select>`;
  }
  function budgetCatMese(id, d) {
    const c = K.cat(id); if (!c) return null;
    if (c.periodo === "settimana") return K.budgetBase(id, d) * K.giorniCiclo(d) / 7;
    if (c.periodo === "mese") return K.budgetBase(id, d);
    return null;
  }
  const varMese = c => somma(S.spese.filter(x => x.cat !== "viaggi" && inRange(x, c.s, c.e)), K.netto);

  // ============================ ESTRATTI ==============================
  const RX_COMM = /commission|comm\.|canone|imposta di bollo|bollo |spese tenuta|competenze|interessi passivi|\bfee\b/i;
  const RX_GIRO = /giroconto|ricarica|top.?up|trasferimento (tra|fra|a) |bonifico a (me|luca)|\btransfer to\b|exchanged to|carta prepagata/i;
  function pulisci(desc) {
    let s = String(desc || "").replace(/\s+/g, " ").trim();
    s = s.replace(/^(pagamento|pag\.?|operazione|acquisto|addebito)\s+(pos|carta|con carta|contactless|sdd|diretto|bancomat)\s*/i, "")
      .replace(/^(pos|sdd|addebito sdd|addebito diretto|pagamento|pag)\s+/i, "")
      .replace(/carta\s*(n\.?|nr\.?)?\s*[\d*x]{4,}/ig, "").replace(/\b\d{2}[\/.-]\d{2}([\/.-]\d{2,4})?\b/g, "")
      .replace(/\b\d{1,2}[:.]\d{2}\b/g, "").replace(/\b[A-Z]{0,3}\d{6,}\b/g, "").replace(/\*+\w*/g, "")
      .replace(/\b(ita|it|italy|italia|eur)\b/ig, "").replace(/\b(rata\s+)?n\.?\s*\d+\b/ig, "").replace(/\s{2,}/g, " ").trim();
    if (!s) s = String(desc || "").trim();
    s = s.length > 46 ? s.slice(0, 46).trim() + "…" : s;
    return s === s.toUpperCase() ? s.toLowerCase().replace(/(^|\s|[-'])\S/g, m => m.toUpperCase()) : s;
  }
  const chiaveRic = d => pulisci(d).toLowerCase().replace(/[^a-zà-ù ]/g, " ").replace(/\s+/g, " ").trim().split(" ").slice(0, 2).join(" ");
  const primaSpesa = () => S.spese.length ? new Date(Math.min(...S.spese.map(x => +new Date(x.ts)))) : new Date();
  function somiglia(desc, nome) {
    const a = desc.toLowerCase(), w = nome.toLowerCase().replace(/\(.*?\)/g, "").split(/[^a-zà-ù0-9]+/).filter(x => x.length >= 3);
    return w.some(x => a.includes(x));
  }
  // Abbina ogni movimento della banca a quello che c'è in Spiccio.
  let _abb = null, _abbKey = "";
  function abbina() {
    const key = E.mov.length + "|" + S.spese.length + "|" + (S.meta.updatedAt || "") + "|" + (E._rev || 0);
    if (_abb && _abbKey === key) return _abb;
    const out = new Map(), usate = new Set(), inizio = primaSpesa(); inizio.setDate(inizio.getDate() - 2);
    const spese = S.spese.filter(x => x.importo > 0);
    const perDaEstratto = new Map(spese.filter(x => x.daEstratto).map(x => [x.daEstratto, x]));
    const movs = E.mov.slice().sort((a, b) => a.data < b.data ? -1 : 1);
    for (const m of movs) {
      const d = new Date(m.data), imp = Math.abs(m.importo);
      if (m.stato === "ignorato") { out.set(m.id, { tipo: "ignorato" }); continue; }
      if (m.importo > 0) { out.set(m.id, { tipo: RX_GIRO.test(m.desc) ? "giroconto" : "entrata" }); continue; }
      const esplicita = perDaEstratto.get(m.id);
      if (esplicita) { usate.add(esplicita.id); out.set(m.id, { tipo: "abbinata", spesa: esplicita }); continue; }
      let best = null, bd = 99;
      for (const x of spese) {
        if (usate.has(x.id) || Math.abs(x.importo - imp) > 0.011) continue;
        const g = Math.abs(giorni(x.ts, d));
        if (g <= 4 && g < bd) { best = x; bd = g; }
      }
      if (best) { usate.add(best.id); out.set(m.id, { tipo: "abbinata", spesa: best }); continue; }
      if (RX_COMM.test(m.desc)) { out.set(m.id, { tipo: "commissione" }); continue; }
      if (RX_GIRO.test(m.desc)) { out.set(m.id, { tipo: "giroconto" }); continue; }
      const fissa = S.fisse.find(f => (Math.abs(f.importo - imp) <= Math.max(1, f.importo * .03) || (f.variabile && somiglia(m.desc, f.nome))) && (somiglia(m.desc, f.nome) || Math.abs(d.getDate() - f.giorno) <= 4));
      if (fissa) { out.set(m.id, { tipo: "fissa", fissa }); continue; }
      const ann = S.annualiDef.find(a => Math.abs(a.importo - imp) <= Math.max(1, a.importo * .03) && (somiglia(m.desc, a.nome) || (a.mesi || []).includes(d.getMonth() + 1) && Math.abs(a.importo - imp) <= a.importo * .01));
      if (ann) { out.set(m.id, { tipo: "fissa", fissa: ann }); continue; }
      if (d < inizio) { out.set(m.id, { tipo: "prima" }); continue; }
      out.set(m.id, { tipo: "mancante" });
    }
    // possibili doppioni: due spese uguali in Spiccio nello stesso giorno, una sola in banca
    for (const m of movs) {
      const r = out.get(m.id); if (r?.tipo !== "abbinata") continue;
      const x = r.spesa;
      const gemella = spese.find(y => y.id !== x.id && !usate.has(y.id) && Math.abs(y.importo - x.importo) < 0.011 && Math.abs(giorni(y.ts, x.ts)) <= 1);
      if (gemella) { r.doppione = gemella; usate.add(gemella.id); }
    }
    _abb = out; _abbKey = key;
    return out;
  }
  function riepilogoE() {
    const a = abbina(); const c = { mancante: [], doppione: [], abbinata: [], fissa: [], entrata: [], giroconto: [], commissione: [], ignorato: [], prima: [] };
    for (const m of E.mov) { const r = a.get(m.id); if (!r) continue; c[r.tipo]?.push(m); if (r.doppione) c.doppione.push(m); }
    return c;
  }
  function abbonamenti() {
    const g = {};
    for (const m of E.mov.filter(x => x.importo < 0)) {
      const k = chiaveRic(m.desc); if (!k || k.length < 3) continue;
      (g[k] = g[k] || []).push(m);
    }
    const a = abbina(), out = [];
    for (const [k, arr] of Object.entries(g)) {
      const mesiDist = new Set(arr.map(m => m.data.slice(0, 7)));
      if (mesiDist.size < 2) continue;
      const imps = arr.map(m => Math.abs(m.importo)), mn = Math.min(...imps), mx = Math.max(...imps);
      if (mx / mn > 1.05 || arr.length > mesiDist.size) continue;
      const ult = arr.slice().sort((x, y) => x.data < y.data ? 1 : -1)[0];
      const tipi = arr.map(m => a.get(m.id)?.tipo);
      const nota = tipi.includes("fissa") ? "fissa" : tipi.includes("abbinata") ? "spiccio" : "no";
      out.push({ nome: pulisci(ult.desc), importo: Math.abs(ult.importo), volte: arr.length, mesi: mesiDist.size, nota, ult });
    }
    return out.sort((x, y) => y.importo - x.importo);
  }

  // ------------------------- LETTURA FILE -----------------------------
  function parseCSV(txt) {
    txt = txt.replace(/^﻿/, "");
    const prima = txt.split(/\r?\n/).slice(0, 15).join("\n");
    const sep = [";", ",", "\t", "|"].map(s => [s, (prima.match(new RegExp(s === "|" ? "\\|" : s, "g")) || []).length]).sort((a, b) => b[1] - a[1])[0][0];
    const rows = []; let row = [], cell = "", q = false;
    for (let i = 0; i < txt.length; i++) {
      const ch = txt[i];
      if (q) { if (ch === '"') { if (txt[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; continue; }
      if (ch === '"') q = true;
      else if (ch === sep) { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && txt[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += ch;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(r => r.some(c => String(c).trim()));
  }
  let xlsxPromise = null;
  function caricaXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!xlsxPromise) xlsxPromise = new Promise((ok, ko) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
      s.onload = () => ok(window.XLSX); s.onerror = () => { xlsxPromise = null; ko(new Error("non riesco a caricare il lettore Excel (serve internet)")); };
      document.head.append(s);
    });
    return xlsxPromise;
  }
  async function leggiFile(file) {
    const n = file.name.toLowerCase();
    if (n.endsWith(".pdf")) throw new Error("I PDF non li leggo ancora: dalla banca scarica il CSV o l'Excel.");
    if (/\.(xlsx|xls|xlsm|ods)$/.test(n)) {
      const X = await caricaXLSX();
      const wb = X.read(await file.arrayBuffer(), { type: "array", cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      return X.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" }).map(r => r.map(c => c instanceof Date ? c : String(c ?? ""))).filter(r => r.some(c => String(c).trim()));
    }
    let txt = await file.text();
    if (txt.includes("�")) { const buf = await file.arrayBuffer(); txt = new TextDecoder("windows-1252").decode(buf); }
    return parseCSV(txt);
  }
  const KW = {
    data: /^(data( (operazione|contabile|valuta|transazione|movimento))?|date|started date|completed date|data op\.?|giorno)$/i,
    desc: /(descrizione|description|causale|dettagli|operazione|merchant|esercente|beneficiario|motivo|note)/i,
    imp: /^(importo|amount|ammontare|importo \(?eur\)?|importo euro|valore|totale)$/i,
    dare: /(uscite|addebiti|addebito|dare|debit|importo uscita|uscita)/i,
    avere: /(entrate|accrediti|accredito|avere|credit|importo entrata|entrata)/i,
    fee: /^(fee|commissione|commissioni)$/i,
    stato: /^(state|stato)$/i,
  };
  function indovinaColonne(rows) {
    let h = 0, best = -1;
    for (let i = 0; i < Math.min(rows.length, 40); i++) {
      const r = rows[i].map(c => String(c).trim());
      const sc = (r.some(c => KW.data.test(c)) ? 1 : 0) + (r.some(c => KW.desc.test(c)) ? 1 : 0) + (r.some(c => KW.imp.test(c) || KW.dare.test(c)) ? 1 : 0);
      if (sc > best) { best = sc; h = i; } if (sc === 3) break;
    }
    const hdr = rows[h].map(c => String(c).trim());
    const find = rx => hdr.findIndex(c => rx.test(c));
    let data = hdr.findIndex(c => /^(data operazione|started date|data contabile)$/i.test(c)); if (data < 0) data = find(KW.data);
    const desc = hdr.findIndex((c, i) => i !== data && !/^data|^date|date$/i.test(c) && KW.desc.test(c));
    const map = { header: h, data, desc, imp: find(KW.imp), dare: -1, avere: -1, fee: find(KW.fee), stato: find(KW.stato) };
    if (map.imp < 0) { map.dare = find(KW.dare); map.avere = find(KW.avere); }
    return map;
  }
  function parseData(v) {
    if (v instanceof Date) return isNaN(v) ? null : v;
    const s = String(v).trim(); if (!s) return null;
    if (/^\d{5}(\.\d+)?$/.test(s)) { const d = new Date(Math.round((parseFloat(s) - 25569) * 864e5)); return isNaN(d) ? null : new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 12); }
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3], m[4] ? +m[4] : 12, m[5] ? +m[5] : 0);
    m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/);
    if (m) { let y = +m[3]; if (y < 100) y += 2000; return new Date(y, +m[2] - 1, +m[1], m[4] ? +m[4] : 12, m[5] ? +m[5] : 0); }
    const d = new Date(s); return isNaN(d) ? null : d;
  }
  function righeMovimenti(rows, map, conto) {
    const out = [];
    for (let i = map.header + 1; i < rows.length; i++) {
      const r = rows[i];
      const d = parseData(r[map.data]); if (!d) continue;
      if (map.stato >= 0 && /reverted|declined|failed|annullat|rifiutat/i.test(String(r[map.stato]))) continue;
      let imp;
      if (map.imp >= 0) imp = parseAmount(String(r[map.imp]).replace(/\s/g, ""));
      else { const a = parseAmount(String(r[map.dare] || "").replace(/\s/g, "")), b = parseAmount(String(r[map.avere] || "").replace(/\s/g, "")); imp = (isFinite(b) && b ? Math.abs(b) : 0) - (isFinite(a) && a ? Math.abs(a) : 0); }
      if (!isFinite(imp) || Math.abs(imp) < 0.005) continue;
      if (map.fee >= 0) { const f = parseAmount(String(r[map.fee])); if (isFinite(f) && f) imp -= Math.abs(f); }
      const desc = String(map.desc >= 0 ? r[map.desc] : "").replace(/\s+/g, " ").trim() || "(senza descrizione)";
      const data = `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`;
      const id = "bk_" + hash(`${conto}|${data.slice(0, 10)}|${r2(imp)}|${desc}`);
      out.push({ id, conto, data, importo: r2(imp), desc });
    }
    // stessa riga ripetuta nello stesso file = movimenti distinti
    const visti = {};
    for (const m of out) { visti[m.id] = (visti[m.id] || 0) + 1; if (visti[m.id] > 1) m.id += "_" + visti[m.id]; }
    return out;
  }
  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }

  async function importaFile(file) {
    let rows;

    if (!rows.length) { toast("File vuoto", "", "bad"); return; }
    const map = indovinaColonne(rows);
    const conti = Object.keys(E.conti);
    const nomeDaFile = /revolut/i.test(file.name) || rows[map.header].some(c => /started date/i.test(c)) ? "Revolut" : (conti[0] || "");
    const hdr = rows[map.header].map(c => String(c).trim());
    const opt = (sel) => `<option value="-1">—</option>` + hdr.map((h, i) => `<option value="${i}"${i === sel ? " selected" : ""}>${esc(h || "colonna " + (i + 1))}</option>`).join("");
    const body = `<p class="note" style="margin-top:0">Ho letto <b>${esc(file.name)}</b>. Controlla che le colonne siano giuste: lo chiedo solo la prima volta per ogni banca.</p>
      <div class="fgrid" style="margin-top:14px">
        <div class="fld w"><label>Conto o carta</label><input class="inp" id="i-conto" list="i-conti" value="${esc(nomeDaFile)}" placeholder="es. Conto principale, Revolut, Amex…"><datalist id="i-conti">${conti.map(c => `<option value="${esc(c)}">`).join("")}</datalist></div>
        <div class="fld"><label>Data</label><select class="inp" id="i-data">${opt(map.data)}</select></div>
        <div class="fld"><label>Descrizione</label><select class="inp" id="i-desc">${opt(map.desc)}</select></div>
        <div class="fld"><label>Importo (con segno)</label><select class="inp" id="i-imp">${opt(map.imp)}</select></div>
        <div class="fld"><label>Commissione (se c'è)</label><select class="inp" id="i-fee">${opt(map.fee)}</select></div>
        <div class="fld"><label>Oppure: uscite</label><select class="inp" id="i-dare">${opt(map.dare)}</select></div>
        <div class="fld"><label>e entrate</label><select class="inp" id="i-avere">${opt(map.avere)}</select></div>
      </div>
      <div id="i-prev" style="margin-top:16px"></div>`;
    modal("Carica estratto conto", body, `<span class="sp"></span><button class="btn" data-x>Annulla</button><button class="btn pri" id="i-ok">Importa</button>`, (ov, close) => {
      const leggi = () => ({ ...map, data: +$("#i-data", ov).value, desc: +$("#i-desc", ov).value, imp: +$("#i-imp", ov).value, fee: +$("#i-fee", ov).value, dare: +$("#i-dare", ov).value, avere: +$("#i-avere", ov).value });

          mv.slice(0, 5).map(m => `<div class="kv"><span class="k">${dDay(new Date(m.data))} · ${esc(pulisci(m.desc))}</span><span class="v ${m.importo > 0 ? "pos" : ""}">${m.importo > 0 ? "+" : ""}${eur(m.importo)}</span></div>`).join("")
          : `<p class="note neg">Con queste colonne non trovo movimenti: controlla data e importo.</p>`;

  function mediaCat(id, arr) { return arr.length ? somma(arr, c => K.spentCat(id, c.s, c.e)) / arr.length : 0; }
  function insights() {
    const out = [], chiusi = mesi().slice(1);
    // categoria in crescita
    if (chiusi.length >= 4) {
      const r3 = chiusi.slice(0, 3), prima = chiusi.slice(3, 6);
      let best = null;
      for (const c of S.categories.filter(x => x.periodo !== "fondo")) {
        const a = mediaCat(c.id, r3), b = mediaCat(c.id, prima);
        if (b >= 20 && (a - b) / b > .15 && (!best || (a - b) / b > best.d)) best = { c, d: (a - b) / b, a };
      }
      if (best) out.push({ icon: "chart", bg: "var(--warn-soft)", col: "var(--warn)", t: `${esc(best.c.nome)}: +${Math.round(best.d * 100)}% negli ultimi 3 mesi`, s: `In media ${M0(best.a)} al mese. Guarda i dettagli in Analisi.` });
    }
    // abbonamento non tracciato
    const ab = abbonamenti().find(x => x.nota === "no");
    if (ab) out.push({ icon: "sync", bg: "#E2EEFC", col: "var(--s1)", t: "Trovato un addebito ricorrente che non segui", s: `${esc(ab.nome)}: ${M(ab.importo)}, ${ab.volte} volte negli estratti conto.` });
    // fissa che finisce
    const ora = K.meseKey();
    const fin = S.fisse.find(f => f.fine && f.fine >= ora && f.fine <= K.meseKey(new Date(Date.now() + 70 * 864e5)));
    if (fin) out.push({ icon: "check", bg: "var(--ok-soft)", col: "var(--ok)", t: `${esc(fin.nome)} finisce a ${MESI[+fin.fine.slice(5) - 1]}`, s: `Dal mese dopo hai ${M(fin.importo)} in più ogni mese.` });
    // mese sotto controllo
    if (out.length < 3) {
      const q = K.quadroMese();
      out.push(q.esito >= 0 ? { icon: "star", bg: "var(--acc-soft)", col: "var(--acc)", t: "Mese sotto controllo", s: `Al ritmo attuale ti avanzano ${M0(q.esito)}. Il prossimo giorno di paga è il ${dShort(q.e)}.` }
        : { icon: "flame", bg: "var(--bad-soft)", col: "var(--bad)", t: "Stai andando oltre il budget", s: `Per chiudere in pari dovresti stare sotto ${M(Math.max(0, (q.disponibile - q.speso) / Math.max(1, q.ggTot - q.ggPassati)))} al giorno.` });
    }
    if (out.length < 3) {
      const top = K.topEsercenti(mesi()[0].s, new Date(), 1)[0];
      if (top) out.push({ icon: "receipt", bg: "var(--soft)", col: "var(--ink)", t: `Questo mese hai speso di più da ${esc(top.nome)}`, s: `${plural(top.n, "volta", "volte")}, ${M(top.tot)} in tutto.` });
    }
    return out.slice(0, 3);
  }

    ov.innerHTML = `<div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}<button class="btn ico ghost" data-x aria-label="Chiudi">${ic("close", 18)}</button></h3>${body}<div class="mfoot">${foot}</div></div>`;
    const close = () => { ov.remove(); document.removeEventListener("keydown", kd); };

      ${medie.map((v, i) => `<div class="hbar"><span class="n">${nomiG[i]}</span><span class="t"><i class="grow ${top2.includes(i) ? "top" : ""}" style="width:${v / mxg * 100}%"></i></span><span class="x">${M(v)}</span></div>`).join("")}</section>`;

    const top = K.topEsercenti(s0, P.corrente.e, 7);
    const eseSec = `<section class="card tilt s6 full-md stretch hide-m ${anim()}"><h2>Dove spendi di più <span class="r">ultimi ${F.anaN} mesi</span></h2><p class="lead">Raggruppato per nota della spesa.</p>
      ${top.map((x, i) => `<div class="li"><span class="disp mut" style="width:22px;font-weight:700;font-size:15px">${i + 1}</span><div class="tx"><div class="t1">${esc(x.nome)}</div><div class="t2">${plural(x.n, "volta", "volte")} · ${M(x.tot / x.n)} in media</div></div><span class="x disp" style="font-size:16px">${M0(x.tot)}</span></div>`).join("") || `<div class="empty">—</div>`}</section>`;

    const prev = previsione(ch);
    const prevSec = `<section class="card s12 ${anim()}"><h2>I prossimi 3 mesi <span class="r">previsione da fisse, salvadanai e il tuo ritmo</span></h2><p class="lead">Quanto ti avanza a fine mese se spendi come negli ultimi 3 mesi (${M0(prev.ritmo)} al mese).</p>
      <div class="fc">${prev.mesi.map(m => `<div><b>${cap(MESI[m.s.getMonth()])}</b><div class="v ${m.av >= 0 ? "pos" : m.av > -50 ? "wrn" : "neg"}">${MS(m.av)}</div><p>${m.note.join(" ") || "Nessuna novità rispetto a questo mese."}</p></div>`).join("")}</div></section>`;

    return `<div class="grid">${kpi}${barre}${catSec}${det}${stipSec}${giorniSec}${eseSec}${prevSec}</div>`;
  }
  function previsione(ch) {
    const ult = ch.slice(-3), ritmo = ult.length ? somma(ult, varMese) / ult.length : 0;
    const out = []; let d = new Date(mesi()[0].e);
    let faseP = K.faseAttiva().nome;
    for (let i = 0; i < 3; i++) {
      const [s] = K.periodRange("mese", d), c = K.contiDelMese(d), note = [];
      const mk = K.meseKey(d);
      S.fisse.filter(f => f.fine && f.fine < mk && f.fine >= K.meseKey(new Date(+s - 864e5))).forEach(f => note.push(`Finisce ${f.nome}: ${eur(f.importo)} in più.`));
      S.fisse.filter(f => f.inizio === mk).forEach(f => note.push(`Parte ${f.nome}: ${eur(f.importo)} al mese.`));
      if (c.piano.vociOra.length) note.push(`Scade ${c.piano.vociOra.join(", ")}${c.piano.scoperto > 0 ? `, ${eur(c.piano.scoperto)} non coperti dal salvadanaio` : ", coperto dal salvadanaio"}.`);
      const f = K.faseAttiva(d); if (f.nome !== faseP) { note.push(`Parte il ${f.nome}: ${eur(f.fondo)} al mese nel fondo.`); faseP = f.nome; }
      if (s.getMonth() + 1 === S.settings.meseTredicesima || (s.getMonth() + 2) % 12 === S.settings.meseTredicesima % 12 && false) note.push("Arriva la tredicesima (non inclusa nel calcolo).");
      if (c.disponibile - ritmo < 0 && c.disponibile - ritmo > -60) note.push("Basta una settimana un po' più leggera per stare in pari.");
      out.push({ s, av: c.disponibile - ritmo, note });
      d = new Date(K.periodRange("mese", d)[1]);
    }
    return { ritmo, mesi: out };
  }

  function bindBudget() {
    $("#v").onchange = e => {
      const t = e.target, coll = t.dataset.coll; if (!coll) return;
      const f = t.dataset.f, tp = t.dataset.t;
      let v = tp === "bool" ? t.checked : t.value.trim();
      if (tp === "num") { v = parseAmount(v); if (!isFinite(v)) { toast("Numero non valido", "", "bad"); return; } }
      if (tp === "int") { v = parseInt(v, 10); if (!isFinite(v)) { toast("Numero non valido", "", "bad"); return; } }
      if (tp === "list") v = v.split(",").map(s => s.trim()).filter(Boolean);
      if (tp === "intlist") v = v.split(/[,; ]+/).map(Number).filter(n => n >= 1 && n <= 12);
      commit(S => {
        if (coll === "settings") { S.settings[f] = v; return; }
        const o = S[coll].find(x => x.id === t.dataset.id); if (!o) return;
        if ((f === "inizio" || f === "fine" || tp === "bool") && !v) delete o[f]; else o[f] = v;
      }, { config: true, after: () => { $("#riep").innerHTML = riepilogoBudget(); if (f === "periodo") render(); } });
    };
  }

      annualiDef: () => ({ id: uid("a"), nome: "Nuova spesa annuale", importo: 0, mesi: [1], giorno: 10 }),

  // ============================== REPORT ==============================
  function datiReport(c) {
    const d = refDate(c), q = K.quadroMese(d), p = K.patrimonio();
    const cat = S.categories.map(x => ({ x, speso: K.spentCat(x.id, c.s, c.e), budget: budgetCatMese(x.id, d) })).filter(r => r.speso > 0.004 || r.budget);
    const top = S.spese.filter(x => x.importo > 0 && inRange(x, c.s, c.e)).sort((a, b) => b.importo - a.importo).slice(0, 8);
    const fuori = S.spese.filter(x => x.motivo && inRange(x, c.s, c.e));
    const prev = mesi().find(z => +z.e === +c.s);
    return { q, p, cat, top, fuori, spPrev: prev ? varMese(prev) : null, live: inCorso(c) };
  }

    let importo, esercente = "", carta = "";
    try { const j = JSON.parse(body); importo = parseAmount(j.importo ?? j.amount); esercente = j.esercente ?? j.merchant ?? ""; carta = j.carta ?? j.card ?? ""; }
    catch (e) { const r = body.split(/\r?\n/).map(s => s.trim()).filter(Boolean); importo = parseAmount(r[0]); esercente = r[1] || ""; carta = r[2] || ""; }
    if (!(Math.abs(importo) > 0)) return null;
    return { id: "gc_" + c.id, ts: c.created_at, importo: Math.abs(importo), esercente: String(esercente).slice(0, 120), carta: String(carta).slice(0, 60), u: Date.parse(c.created_at) };
  }
  // Stesso algoritmo dell'app: scarica, unisce voce per voce, ricarica.
  async function sync(manuale) {
    if (!L.token || !L.gistId || syncing) return;
    if (!navigator.onLine) { if (manuale) toast("Sei offline", "Sincronizzo appena torna la rete.", "warn"); return; }
    syncing = true; paintSync();
    try {
      let locale = null; try { locale = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
      if (locale) S = Core.normalizza(Core.merge(S || locale, locale));
      const g = await gh(`/gists/${L.gistId}`);
      let remote = null; const f = g.files?.["spiccio.json"];
      if (f) { let txt = f.content; if (f.truncated) txt = await (await fetch(f.raw_url)).text(); try { remote = txt ? JSON.parse(txt) : null; } catch (e) { remote = null; } }
      if (!S && !remote) throw new Error("il Gist non contiene dati di Spiccio");
      const remN = remote ? Core.normalizza(remote) : null;
      const merged = Core.normalizza(Core.merge(S, remN));
      let commenti = [];
      if (g.comments > 0) commenti = await gh(`/gists/${L.gistId}/comments?per_page=100`);
      let nuovi = 0;
      for (const c of commenti) { const it = parseInbox(c); if (it && !merged.deleted[it.id] && !merged.inbox.some(x => x.id === it.id) && !merged.spese.some(x => x.daInbox === it.id)) { merged.inbox.push(it); nuovi++; } }
      const strip = o => { if (!o) return ""; const c = { ...o, meta: { ...o.meta, updatedAt: null } }; return JSON.stringify(c); };
      if (strip(merged) !== strip(remN) || commenti.length) {
        merged.meta.updatedAt = new Date().toISOString();
        await gh(`/gists/${L.gistId}`, { method: "PATCH", body: JSON.stringify({ files: { "spiccio.json": { content: JSON.stringify(merged) } } }) });
        for (const c of commenti) { try { await gh(`/gists/${L.gistId}/comments/${c.id}`, { method: "DELETE" }); } catch (e) {} }
      }
      const prima = S ? strip(S) : "";
      S = merged; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      K = Core.make(S);
      L.lastSync = Date.now(); L.syncErr = null; saveLocal();
      if (nuovi) toast(plural(nuovi, "pagamento nuovo dal Wallet", "pagamenti nuovi dal Wallet"), "Lo trovi in Oggi.", "ok");
      else if (manuale) toast("Sincronizzato", "", "ok");
      syncing = false;
      if (!prima || manuale || prima !== strip(S)) { if (!document.querySelector(".ov") && !isEditing()) { animate = !prima; render(); } else paintSync(); } else paintSync();
    } catch (e) {
      if (e instanceof TypeError) e = new Error("GitHub non raggiungibile: sei offline?");
      L.syncErr = e.message; saveLocal(); syncing = false;
      if (manuale) toast("Sincronizzazione non riuscita", e.message, "bad");
      if (!S || !$(".dash")) render(); else paintSync();
    }
  }
  const isEditing = () => { const a = document.activeElement; return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || (a.tagName === "SELECT" && (view === "budget" || view === "spese" || view === "estratti"))); };
  function paintSync() {
    const st = $("#syncst"); if (!st) return;
    const ult = L.lastSync ? new Date(L.lastSync).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }) : "mai";
    st.innerHTML = `<span class="dot ${L.syncErr ? "bad" : syncing ? "busy" : "ok"}"></span>${L.syncErr ? esc(L.syncErr) : syncing ? "Sincronizzo…" : `Sincronizzato con l'iPhone · ${ult}`}`;
  }

  // ============================== AZIONI ==============================
  const ACT = {
    sync: () => sync(true),
    hide: () => { L.nascondi = !L.nascondi; saveLocal(); animate = false; render(); },
    esci: () => conferma("Scollegare questo dispositivo?", "Tolgo token, dati ed estratti da questo browser. Il Gist e l'iPhone restano com'erano.", "Scollega", () => { localStorage.removeItem(KEY); localStorage.removeItem(EKEY); L.token = ""; L.gistId = ""; try { localStorage.setItem(LKEY, JSON.stringify({ ...JSON.parse(localStorage.getItem(LKEY) || "{}"), token: "", gistId: "" })); } catch (e) {} S = null; K = null; E = { mov: [], conti: {} }; render(); }),
    nuova: () => modaleSpesa(),
    edit: d => modaleSpesa({ editId: d.id }),
    del: d => eliminaSpese([d.id]),
    bulkdel: () => eliminaSpese([...F.sel]),
    bulkclear: () => { F.sel.clear(); renderTabella(); },
    more: () => { F.limite += 300; renderTabella(); },
    csv: () => esportaCSV(),
    inbox1: () => { const it = S.inbox.slice().sort((a, b) => a.ts < b.ts ? -1 : 1)[0]; if (it) modaleSpesa({ inbox: it }); },
    confFissa: d => confermaFissa(d.id),
    carica: () => { if (view !== "estratti") { go("estratti"); setTimeout(() => $("#file")?.click(), 60); } else $("#file")?.click(); },
    eTab: d => { F.eTab = d.v; F.eSel.clear(); $$(".seg button[data-act=eTab]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === d.v)); renderTabE(); },
    eAdd: d => { const m = E.mov.find(x => x.id === d.id); if (m) modaleSpesa({ mov: m }); },
    eAddAll: () => { const ids = F.eSel.size ? [...F.eSel] : movDellaTab().map(m => m.id); aggiungiMov(ids); },
    eIgn: d => { const m = E.mov.find(x => x.id === d.id); if (m) { m.stato = "ignorato"; E._rev = (E._rev || 0) + 1; saveE(); animate = false; render(); } },
    eRip: d => { const m = E.mov.find(x => x.id === d.id); if (m) { delete m.stato; E._rev = (E._rev || 0) + 1; saveE(); animate = false; render(); } },
    svuotaE: () => conferma("Cancellare gli estratti?", "Tolgo da questo computer tutti i movimenti caricati. Le spese già aggiunte a Spiccio restano.", "Cancella", () => { E = { mov: [], conti: {} }; saveE(); render(); }),
    anaN: d => { F.anaN = +d.v; render(); },
    anaCat: d => { F.anaCat = d.v && F.anaCat !== d.v ? d.v : null; animate = false; render(); if (F.anaCat) setTimeout(() => { const t = [...$$(".card h2")].find(h => h.textContent.includes("nel dettaglio")); t?.scrollIntoView({ behavior: "smooth", block: "center" }); }, 50); },
    addrow: d => addRow(d.coll),
    rmrow: d => conferma("Eliminare la riga?", "La modifica arriva anche sull'iPhone.", "Elimina", () => commit(S => { S[d.coll] = S[d.coll].filter(x => x.id !== d.id); }, { config: true })),
    print: () => window.print(),
    mail: () => { location.href = `mailto:?subject=${encodeURIComponent(`Report Spiccio · ${MESI[meseDi(F.repMese).s.getMonth()]}`)}&body=${encodeURIComponent(testoMail())}`; },
  };
  function go(v) { view = v; F.sel.clear(); F.eSel.clear(); history.replaceState(null, "", "#" + v); window.scrollTo(0, 0); animate = true; render(); }

  function init() {
    loadAll();
    document.addEventListener("click", e => {
      if (e.target.closest(".ov")) { const a = e.target.closest("[data-act]"); if (a && ACT[a.dataset.act] && !e.target.closest(".modal")) return; }
      const g = e.target.closest("[data-go]"); if (g) { go(g.dataset.go); return; }
      const a = e.target.closest("[data-act]"); if (a && ACT[a.dataset.act]) { e.preventDefault(); ACT[a.dataset.act](a.dataset); }
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Enter" && e.target.matches?.("[role=button][data-act]")) { e.preventDefault(); e.target.click(); return; }
      if (document.querySelector(".ov") || !S || !L.token) return;
      const t = e.target.tagName; if (t === "INPUT" || t === "SELECT" || t === "TEXTAREA" || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "n" || e.key === "N") { e.preventDefault(); modaleSpesa(); }
      else if (e.key === "/") { e.preventDefault(); if (view !== "spese") go("spese"); setTimeout(() => $("#f-q")?.focus(), 30); }
      else if (/^[1-7]$/.test(e.key) && !isMobile()) go(VIEWS[+e.key - 1][0]);
      else if (e.key === "r" || e.key === "R") sync(true);
    });
    document.addEventListener("pointermove", showTip, { passive: true });
    document.addEventListener("pointerdown", showTip, { passive: true });
    document.addEventListener("scroll", () => { const t = $("#tip"); if (t) t.hidden = true; }, { passive: true });
    let rz, wasM = isMobile();
    window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (!S || !L.token) return; if (isMobile() !== wasM) { wasM = isMobile(); animate = false; render(); } else drawCharts(); }, 150); });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && L.token && Date.now() - (L.lastSync || 0) > 20e3) sync(false); });
    setInterval(() => { if (document.visibilityState === "visible" && L.token && !syncing) sync(false); }, 60e3);
    window.addEventListener("online", () => queueSync());
    window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h !== view && VIEWS.some(v => v[0] === h)) go(h); });
    window.addEventListener("storage", e => { if (e.key === KEY && e.newValue) { try { S = Core.normalizza(JSON.parse(e.newValue)); K = Core.make(S); if (!document.querySelector(".ov") && !isEditing()) { animate = false; render(); } } catch (err) {} } });
    render();
    if (L.token && L.gistId) sync(false);
  }
  window.__spiccioDash = { get S() { return S; }, get E() { return E; }, abbina, abbonamenti, righeMovimenti, indovinaColonne, parseCSV, pulisci, render };
  init();
})();
</script>
